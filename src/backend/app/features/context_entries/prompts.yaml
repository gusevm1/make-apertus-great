list_context_entries: >-
  Lists what I noted about myself in the TrustRoom: my goals (with an amount in CHF and a target date
  where I gave one), facts about my life and my preferences. Use it when my question touches my
  plans, my savings goals or my situation. Where an entry of mine disagrees with my bank profile or a
  document, my entry counts; say that the figure comes from my own entry. Without text it returns my
  newest entries; when my question names a topic, a place or a goal, send it as text to search all of
  them.
list_context_entries_text: >-
  Words to search my entries for, such as "Norwegen" or "Ferien Auto". An entry holding any of the
  words matches. Leave it out to get my newest entries.
list_context_entries_left_out: >-
  {count} older entries are not in this list. To find one, call list_context_entries again with
  text set to a word it may hold. Until a search has been made, never say that I noted nothing about
  something.
propose_context_entry: >-
  Proposes to remember one goal, fact or preference that I stated about myself in my last message,
  such as "I want to save CHF 6'000 for Japan by 30 June 2027". Nothing is kept until I confirm the
  proposal in the page, so tell me it waits for my confirmation. Use it only when I tell you about
  my plans, my situation or my wishes, never for a question alone. Propose only what I said, in my
  words and with my figures: never a figure computed or looked up from my bank data, my documents
  or earlier results. At most one proposal per message.
propose_context_entry_kind: "goal for something I want to reach, fact for something about me, preference for how I want things done."
propose_context_entry_text: The entry in one sentence of at most 300 characters, in my language and close to my words.
propose_context_entry_amount: The amount in CHF that I named for a goal, as a plain number. Leave it out when I named none.
propose_context_entry_date: The date by which I want to reach a goal, as YYYY-MM-DD. Leave it out when I named none.
propose_context_entry_replaces: >-
  Only when this changes one of my entries, a few words of that entry as list_context_entries
  returns it. Leave it out otherwise.
