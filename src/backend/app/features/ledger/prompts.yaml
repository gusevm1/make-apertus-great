# One description per tool, then the arguments. Every tool counts the customer's ledger: all bookings
# of all accounts and all credit card purchases, each money movement once. The server adds it up.
search_movements: >-
  Find the customer's money movements on all accounts and cards: date, amount in CHF (negative means
  money out), text, counterparty and kind. Returns `count`, `money_out_chf` and `money_in_chf` over
  ALL matching movements, even those not listed, so use those sums and never add up rows yourself.
  Movements carry no category, so a category word such as "rent", "online shops" or "groceries" in
  `text` finds nothing. Pass the names of the merchants or the landlord instead, and when you do not
  know them, call sum_by_counterparty first to see who the customer pays. Use it for "how much did I
  spend at Migros" or "show my largest payments". A row marked `provisional` is a credit card purchase
  on a statement that is still open. `provisional_out_chf` is the part of `money_out_chf` from such
  rows, `provisional_in_chf` the part of `money_in_chf`. When either is not 0, say in the answer
  that this part is provisional until the card statement closes.
sum_by_month: >-
  The customer's money movements added up per month: for each month of the period its `count`,
  `money_out_chf` and `money_in_chf`, also months with no match, as 0. Takes the same filters as
  search_movements, also the names in `text`. Use it for "my spending per month", "did I pay my rent
  each month" (with the landlord's name) or "when did the child support come in". Each month and the
  total have `provisional_out_chf` and `provisional_in_chf`, as in search_movements.
sum_by_counterparty: >-
  The customer's money movements added up per counterparty, such as a shop, a landlord or a person,
  the largest first (up to `limit`, 15 at most) and the rest as `others`. Takes the same filters as search_movements. Use it
  for "where does my money go", and first when a question names a category instead of a merchant
  (rent, online shops, insurance), to find the names to pass to the other tools. The total has
  `provisional_out_chf` and `provisional_in_chf`, as in search_movements.
forecast_months: >-
  The trend of the customer's money movements over the last full months, and where a straight line
  through them leads in the next months. Returns `average_chf` per month, `trend_chf_per_month`, the
  trend in % of the average, and a `projection` with the trend value and the average for each coming
  month. Without `kind` it adds spending and credits, which is the net cash flow: for a question about
  spending pass kind spending. Amounts are signed, so for spending a negative trend means the
  spending grows. It is a
  straight-line trend from past months, not a prediction: say so, and name the months it rests on.
  Takes the same filters as search_movements except the period. Use it for "is my spending going up"
  or "what will I spend per month if this continues".
sum_by_group: >-
  The customer's money movements added up per `quarter`, `year`, `weekday`, `account` or `kind`, each
  group with its `count`, `money_out_chf` and `money_in_chf`, and each group and the total with
  `provisional_out_chf` and `provisional_in_chf`, as in search_movements. Takes the same filters as
  search_movements. Use it for "2025 against 2024" (year), "do I spend more at weekends" (weekday),
  "what goes out of my savings account" (account) or "how much came in and went out" (kind, with
  every kind that should count). One call covers a comparison: for 2025 against 2024, group by year
  over both years.
find_unusual_movements: >-
  The customer's payments in the period that stand out, each with its `reason`: `unusual_amount` is
  more than 3 times the median of the payments to the same counterparty over the year before (shown
  as `typical_chf`, from `typical_count` payments) and at least CHF 100 above it, `first_payment` is
  the first payment ever to a counterparty, CHF 100 or more, and `same_day_twice` is the same amount
  to the same counterparty twice on one day, CHF 20 or more. Standing orders and cash withdrawals are
  not checked. Without a period it checks the last full month. Use it, not search_movements, for "is
  anything unusual on my accounts", "was I charged twice" or "any payments I should check". A flag is a reason to look, not proof of a mistake or of fraud:
  say what stands out and why, and name the movement. When nothing is flagged, say that `checked`
  payments were looked at and none stood out.
compare_periods: >-
  Compares two periods, in either order, under the same filters as search_movements: each period's
  sums and average per month, and the change in CHF and percent of the totals and of the averages.
  Use it for "how has my spending changed since ...", "since I started working" or "this summer
  against last summer", and never subtract sums yourself. For "since I started working" or "since
  my new job", set `since_salary_start` and leave out the dates: the server splits at the first
  salary of today's level and names it as `salary_start`.
explain_balance_change: >-
  How the balance of one account changed over a period, from its bookings: `start_balance_chf`
  before the first booking of `date_from`, `end_balance_chf` after the last booking of `date_to`,
  the `change_chf`, the money in and out between them, and the 5 counterparties that paid in and
  took out the most, the rest as `others_in` and `others_out`. It counts every booking of the
  account, also transfers between own accounts and card bills, because they all move the balance.
  Credit card purchases count only through the bill that paid them. `unexplained_chf` is 0 when
  start plus money in plus money out gives the end balance; when it is not 0, say so. Use it for
  "why is my account lower than a month ago" or "where did my savings go since June", with the
  account id from list_accounts. Use these figures and never add or subtract balances yourself.
tax_year_summary: >-
  The figures from the bank that a Swiss tax return for one year asks for: the mortgage interest
  paid, the payments into Pillar 3a with the year's limit and `pillar_3a_over_limit_chf` when they
  exceed it, each account's balance after its last booking of the year, and the portfolio value on
  31 December. Amounts paid are positive. When `until` is before 31 December, the year is not over
  and the figures are so far. Use it for "what do I need for my tax return" or "how much did I pay
  into my 3a in 2025". Dividends are not included. Pass on its `note` in the answer.
tax_year_note: >-
  Say in the answer, in the customer's language, that these are figures from the bank for the tax
  return, not tax advice, and that no tax was computed.
unknown_account: >-
  The ledger has no bookings of {account_id}. Pass one of these account ids: {account_ids}.
not_enough_months: >-
  Only {months} full months of bookings exist for this, and a trend needs at least 3. Answer with the
  monthly sums from sum_by_month instead.
text_not_found: >-
  No movement in the whole ledger contains {words}. Movements carry no category: call
  sum_by_counterparty for the period to see who the customer pays, then search for those names.

date_from: "First day of the period, as YYYY-MM-DD."
date_to: "Last day of the period, as YYYY-MM-DD."
text: "Words to look for in the text and the counterparty, such as merchant names. A movement matches when it contains any of them."
kind: "Which kinds to count: spending (money out), credit (money in), own_transfer (between own accounts or into the depot), card_settlement (the bill of a credit card, whose purchases count already). Leave it out for spending and credit."
tax_year: "The tax year, such as 2025."
balance_date_from: "First day of the period, as YYYY-MM-DD. The start balance is the one before this day's bookings."
balance_date_to: "Last day of the period, as YYYY-MM-DD. The end balance is the one after this day's bookings."
account_id: "An account id from list_accounts, such as ACC-PRIV."
card_id: "A card id from list_cards."
amount_min: "Smallest amount in CHF, without a sign."
amount_max: "Largest amount in CHF, without a sign."
months_back: "How many full months before today the trend rests on, from 3 to 24."
months_ahead: "How many months after the last full month to project, from 1 to 6."
group_by: "What to add up per: quarter, year, weekday, account or kind."
counterparty_limit: "How many counterparties to list one by one. The rest is added up as `others`."
sort: "The order of the listed movements: newest, oldest, or largest for the biggest amounts first, as in \"my largest payments\"."
not_a_date: >-
  "{value}" is not a date. For a job start, set since_salary_start instead of the dates.
dates_or_salary_start: >-
  Give all four dates, first_from, first_to, second_from and second_to, or set since_salary_start.
salary_since_history_start: >-
  The salary has been at today's level since {date}, when the bank's history starts, so there is no
  earlier period to compare with. Answer with the monthly sums from sum_by_month instead.
no_salary: >-
  No salary was booked in the bank's history, so no job start can be found. Ask the customer when
  the job started and compare those dates.
since_salary_start: "True to compare everything before the first salary of today's level with everything since. Then leave out the four dates."
first_from: "First day of one period, as YYYY-MM-DD."
first_to: "Last day of that period, as YYYY-MM-DD."
second_from: "First day of the other period, as YYYY-MM-DD."
second_to: "Last day of the other period, as YYYY-MM-DD."
limit: "How many movements to list. The sums always cover all matching movements."
