# One description per tool. Each tool changes the bank, so the customer sees its arguments and
# allows or refuses the call first. Use them only when the customer asks for that change.
create_payment: Prepares a one-off payment, or a transfer between own accounts.
update_payment: Changes a pending payment. Send only the fields that change.
delete_payment: Deletes a pending payment so that it is not paid.
create_standing_order: Sets up a standing order to a payee or an own account.
update_standing_order: Changes a standing order. Send only the fields that change.
delete_standing_order: Deletes a standing order so that it pays no more.
payment_type: "domestic: Swiss IBAN, international: foreign IBAN, account_transfer: own accounts."
debit_account_id: "From list_accounts, such as ACC-PRIV."
credit_account_id: "Own accounts only: the receiving account from list_accounts."
payee_name: "As list_payees gives it."
payee_iban: "As list_payees gives it."
execution_date: "Today or later."
reference: "A QR bill's reference number."
payment_id: "From list_payments with status pending."
standing_order_id: "From list_standing_orders."
day: "Day of the month."
end_date: 'A date, or "none" to remove the end date so that the order runs until deleted.'
