intro: |
  You build a widget by choosing components from this catalogue and filling them in. Our code draws them in the e-banking's look.
  Every figure comes from DATA. A field marked "path into DATA" names where a value is, such as "months[5].total_chf" or "payments"; never write a figure yourself. Labels and titles are your own words.
  Return one widget: {"title": ..., "subtitle": optional, "body": one component}. Put several components into a stack or a grid.

# How one component and one of its fields are written; {kind} is one of `kinds` below.
component: "{name}: {description}\n  fields: {fields}\n  example: {example}"
field: "{field} ({kind}{limits}{optional})"
optional: ", optional"
limits:
  items: ", {min} to {max} items"
  at_most_items: ", at most {max} items"
  at_most_characters: ", at most {max} characters"
field_separator: "; "
kinds:
  path: path into DATA
  field: field name of the rows
  fields: list of field names of the rows
  stats: "list of {{label, value: path into DATA, and optional trend, change and good_when as in kpi}}"
  trend: "{{data: path into DATA, x and y: field names of its rows}}"
  figures: "list of {{label, field: field name of the case rows}}"
  components: list of components
  choice: "one of {values}"
  colors: "map from a label or series value of the chart's rows to a colour, one of {values}"
  boolean: true or false
  text: text

kpi:
  description: One figure, large, with an optional second figure to compare it with. `trend` adds a small line of the series the figure belongs to. `change` names a change figure DATA holds (never one you work out), and `good_when` says which way is good, down for spending and up for savings. A change is the later figure minus the earlier one, in the figure's own sign. The label says what the figure is; the period or name of its row is added from DATA, so leave it out of the label.
  example: {"type": "kpi", "label": "Spending", "value": "months[5].total_chf", "compare": "months[4].total_chf", "trend": {"data": "months", "x": "label", "y": "total_chf"}}
stat_row:
  description: Two to four small figures side by side, each with a label, and each with the same optional trend and change as a kpi.
  example: {"type": "stat_row", "stats": [{"label": "Rent", "value": "payees[0].total_chf"}, {"label": "Taxes", "value": "payees[1].total_chf"}]}
table:
  description: Rows of a list in DATA with the columns you choose, and an optional total that DATA already holds.
  example: {"type": "table", "title": "Due in the next 30 days", "rows": "payments", "columns": ["due_date", "payee", "amount_chf"], "total": "total_chf"}
list:
  description: A compact list for narrow spaces, one line per row with a label, an optional detail and a value.
  example: {"type": "list", "rows": "payments", "label": "payee", "detail": "due_date", "value": "amount_chf"}
timeline:
  description: Rows in date order along a line, such as payments that fall due; each with its date, a label, an optional detail and a value.
  example: {"type": "timeline", "title": "Due next", "rows": "payments", "date": "due_date", "label": "payee", "detail": "description", "value": "amount_chf"}
bar_chart:
  description: >-
    Bars for one value per label, such as spending per month. `horizontal` suits long labels such as payee names. `highlight` names one label to draw in the accent colour, or in `highlight_color`. `colors` gives labels a colour the customer asked for, so "make October red" becomes "colors": {"2026-10": "red"}, with the label as DATA writes it.
  example: {"type": "bar_chart", "data": "months", "x": "label", "y": "total_chf", "highlight": "2026-10"}
line_chart:
  description: >-
    A line over labels in order, such as months; `series` draws one line per value of that field, such as one per year. The newest year or month gets the accent colour; `colors` gives a series value another colour, such as {"2025": "blue"}.
  example: {"type": "line_chart", "data": "years", "x": "month", "y": "total_chf", "series": "year"}
area_chart:
  description: A filled area over labels in order, such as spending per month; with `series`, one area per value of that field, drawn over each other, and `colors` as in line_chart.
  example: {"type": "area_chart", "data": "months", "x": "label", "y": "total_chf"}
comparison:
  description: Bars of two or more periods side by side for each label, such as each month of this year next to last year; `series` names the period field, and `colors` works as in line_chart.
  example: {"type": "comparison", "title": "This year against last year", "data": "years", "x": "month", "y": "total_chf", "series": "year"}
donut:
  description: The shares of a whole as a ring, with a legend of every part and its value, such as spending per payee; `total` is a total DATA already holds, and `colors` gives a part's label a colour.
  example: {"type": "donut", "data": "payees", "label": "label", "value": "total_chf", "total": "payees_total_chf"}
forecast_chart:
  description: >-
    One series that runs from actual figures into a forecast, such as money left over per month and where it is heading. Use it only when DATA holds such a series: rows whose `kind` field says "actual" or "forecast", actual rows first. Actual is a solid line, forecast a dashed one; `low` and `high` name the fields of the forecast rows that hold its range, both or neither.
  example: {"type": "forecast_chart", "title": "Left over per month", "data": "forecast", "x": "month", "y": "net_chf", "kind": "kind", "low": "low_chf", "high": "high_chf"}
budget_bars:
  description: >-
    What was spent against a budget, one bar per row with the budget as a marker; a row over its budget is drawn and named as over. Use it only when DATA holds a budget for each row, beside what was spent.
  example: {"type": "budget_bars", "title": "Against budget", "data": "budgets", "label": "category", "actual": "spent_chf", "budget": "budget_chf"}
waterfall:
  description: >-
    Steps from a starting figure through what was added and taken away, such as income, then spending groups, then what is left. Use it only when DATA holds the steps in order, each with its `start`, `end` and `amount`, every step starting where the one before ended. `total` names what is left, a figure DATA holds, drawn as a last bar from zero; `total_label` names that bar.
  example: {"type": "waterfall", "title": "October", "data": "flow", "label": "step", "start": "start_chf", "end": "end_chf", "amount": "amount_chf", "total": "left_chf", "total_label": "Left"}
calendar:
  description: >-
    One cell per day, coloured by its value, weeks side by side, such as spending per day over a few months. Use it only when DATA holds one row per day with its date.
  example: {"type": "calendar", "title": "Spending per day", "data": "days", "date": "date", "value": "total_chf"}
scenarios:
  description: >-
    Cases side by side that the customer switches between, such as rent today, 200 more and 400 more; DATA holds one row per case with its figures. `label` names the field that names each case, and each figure names a field of the case rows.
  example: {"type": "scenarios", "title": "With a higher rent", "data": "rent_cases", "label": "case", "figures": [{"label": "Rent", "field": "rent_chf"}, {"label": "Left over per month", "field": "left_chf"}]}
progress:
  description: A figure against a goal as a bar, such as savings towards a trip; both come from DATA.
  example: {"type": "progress", "label": "Japan trip 2027", "value": "goals[0].saved_chf", "goal": "goals[0].goal_chf", "goal_label": "Goal"}
callout:
  description: A short note in words, such as what stands out; it holds no figures. `tone` is warning for something to watch.
  example: {"type": "callout", "text": "These figures cover card purchases by purchase date.", "tone": "info"}
stack:
  description: Components one below the other.
  example: {"type": "stack", "children": [{"type": "kpi", "label": "Total", "value": "months_total_chf"}, {"type": "bar_chart", "data": "months", "x": "label", "y": "total_chf"}]}
grid:
  description: Two or three columns side by side on wide screens, one column on a phone.
  example: {"type": "grid", "columns": 2, "children": [{"type": "kpi", "label": "October", "value": "months[5].total_chf"}, {"type": "kpi", "label": "September", "value": "months[4].total_chf"}]}
