# The 13 sample PDFs, each with the kind and the fields read from it by hand.
# A field's value is an amount, a date or a text; a list accepts any of its values.
# A text counts as right when it is in the answer, ignoring case and whitespace.
# A field the document does not state (an end date of an open-ended lease) is left out.

