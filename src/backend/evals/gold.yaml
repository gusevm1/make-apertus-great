# Gold figure questions on 27.11.2026, scored by `python -m evals.score`.
# Each figure is a spec that `python -m evals.gold` computes from the banking API, checks against a
# second path and freezes in gold_figures.json. Never type a figure here and never change a frozen one.
# `split` was fixed before the first baseline run: tune on `tune`, report `held_out` only. About a
# third is held out, spread over every category and customer, and a question asked of several
# customers (`template`) stays on one side.
# Spec fields: source (ledger, bookings, card, accounts, loans, upcoming), measure (out, in, net,
# count, sum), date_from, date_to, text (word starts, any), kind (ledger), type, account, card,
# plus and minus (other specs added or taken away).

questions:
  # ---------------------------------------------------------------- Lukas
  - id: l01
    customer: lukas
    template: total_balance
    category: balance
    split: tune
    question: What is my total balance across all my accounts right now?
    call_sets:
      - [{tool: list_accounts}]
    example: [{tool: list_accounts}]
    figures:
      - {name: total, source: accounts, measure: sum}
      - {name: private, source: accounts, measure: sum, account: [ACC-PRIV], required: false}
      - {name: pillar_3a, source: accounts, measure: sum, account: [ACC-3A], required: false}
      - {name: long_term, source: accounts, measure: sum, account: [ACC-LT], required: false}
      - {name: reserves, source: accounts, measure: sum, account: [ACC-RES], required: false}
      - {name: taxes, source: accounts, measure: sum, account: [ACC-TAX], required: false}
    decoys:
      - name: without_3a
        failure: in_source_but_wrong
        source: accounts
        measure: sum
        account: [ACC-PRIV, ACC-TAX, ACC-RES, ACC-LT]
    traps:
      - Adding the balances in the answer instead of quoting total_balance_chf.
      - Giving the asset overview, which adds the depot, as the account total. Customers without a
        depot may use it.

  - id: l02
    customer: lukas
    category: period_spending
    split: tune
    question: Wie viel habe ich im Oktober bei der Migros ausgegeben?
    call_sets:
      - [{tool: search_movements, arguments: {text: '.*migros.*', date_from: 2026-10-01, date_to: 2026-10-31}}]
      - [{tool: sum_by_month, arguments: {text: '.*migros.*', date_from: '2026-(0\d|10)-01', date_to: 2026-10-31}}]
    example: [{tool: search_movements, arguments: {text: [Migros], date_from: 2026-10-01, date_to: 2026-10-31}}]
    figures:
      - {name: migros, source: ledger, text: [Migros], date_from: 2026-10-01, date_to: 2026-10-31}
      - {name: on_account, source: bookings, measure: out, text: [Migros], date_from: 2026-10-01, date_to: 2026-10-31, required: false}
      - {name: on_card, source: card, measure: out, text: [Migros], date_from: 2026-10-01, date_to: 2026-10-31, required: false}
    traps:
      - The Migros Take Away purchase is on the Visa card, so the account alone gives 413.77.
      - Adding the card purchase to the account figure in the answer step.

  - id: l03
    customer: lukas
    category: card
    split: tune
    question: How much did I spend with my Visa credit card in October?
    call_sets:
      - [{tool: search_movements, arguments: {card_id: CARD-VISA, date_from: 2026-10-01, date_to: 2026-10-31}}]
      - [{tool: sum_by_month, arguments: {card_id: CARD-VISA, date_to: 2026-10-31}}]
    example: [{tool: search_movements, arguments: {card_id: CARD-VISA, date_from: 2026-10-01, date_to: 2026-10-31}}]
    figures:
      - {name: purchases, group: visa_october, source: ledger, card: CARD-VISA, date_from: 2026-10-01, date_to: 2026-10-31}
      - {name: statement, group: visa_october, source: ledger, card: CARD-VISA, measure: net, date_from: 2026-10-01, date_to: 2026-10-31}
      - {name: refund, source: ledger, card: CARD-VISA, measure: in, date_from: 2026-10-01, date_to: 2026-10-31, required: false}
    decoys:
      - {name: october_2025, failure: wrong_date_range, source: ledger, card: CARD-VISA, date_from: 2025-10-01, date_to: 2025-10-31}
      - {name: bill_booked_in_october, failure: wrong_date_range, source: bookings, measure: out, type: [card_settlement], date_from: 2026-10-01, date_to: 2026-10-31}
    traps:
      - The card bill booked in October pays the September purchases.
      - Gross purchases and the statement total differ by the Digitec refund; either is right if named.

  - id: l04
    customer: lukas
    category: card
    split: held_out
    question: Wie hoch war die Visa-Abrechnung, die im November von meinem Konto abgebucht wurde?
    call_sets:
      - [{tool: search_movements, arguments: {kind: '.*card_settlement.*', date_from: '2026-11-.*'}}]
      - [{tool: sum_by_month, arguments: {kind: '.*card_settlement.*', date_to: '2026-11-.*'}}]
    example: [{tool: search_movements, arguments: {kind: [card_settlement], date_from: 2026-11-01, date_to: 2026-11-27}}]
    figures:
      - {name: bill, source: bookings, measure: out, type: [card_settlement], date_from: 2026-11-01, date_to: 2026-11-27}
    decoys:
      - {name: november_purchases, failure: wrong_date_range, source: card, measure: net, date_from: 2026-11-01, date_to: 2026-11-27}
    traps:
      - The bill debited on 20.11. is the October statement, not the open November one.
      - Card bills are kind card_settlement, so search_movements without that kind finds nothing.

  - id: l05
    customer: lukas
    category: card
    split: tune
    question: How much have I spent on my Visa card so far this month?
    call_sets:
      - [{tool: search_movements, arguments: {card_id: CARD-VISA, date_from: 2026-11-01}}]
      - [{tool: sum_by_month, arguments: {card_id: CARD-VISA, date_from: 2026-11-01}}]
    example: [{tool: search_movements, arguments: {card_id: CARD-VISA, date_from: 2026-11-01, date_to: 2026-11-27}}]
    figures:
      - {name: purchases, source: ledger, card: CARD-VISA, date_from: 2026-11-01, date_to: 2026-11-27}
    decoys:
      - {name: bill_booked_in_november, failure: wrong_date_range, source: bookings, measure: out, type: [card_settlement], date_from: 2026-11-01, date_to: 2026-11-27}
    traps:
      - The November statement is still open, so the figure is provisional and has to say so.
      - The bill debited this month pays October, not this month's purchases.

  - id: l06
    customer: lukas
    template: spending_last_month
    category: period_spending
    split: tune
    question: How much did I spend in total last month?
    call_sets:
      - [{tool: sum_by_month, arguments: {date_from: '2026-(0\d|10)-01', date_to: 2026-10-31}}]
      - [{tool: search_movements, arguments: {date_from: 2026-10-01, date_to: 2026-10-31}}]
      - [{tool: sum_by_group, arguments: {date_from: 2026-10-01, date_to: 2026-10-31}}]
    not_called: [list_card_statements]
    example: [{tool: sum_by_month, arguments: {date_from: 2026-10-01, date_to: 2026-10-31}}]
    figures:
      - {name: spent, group: spending, source: ledger, kind: [spending], date_from: 2026-10-01, date_to: 2026-10-31}
      - name: spent_net
        group: spending
        source: ledger
        kind: [spending]
        date_from: 2026-10-01
        date_to: 2026-10-31
        minus: [{source: ledger, card: CARD-VISA, measure: in, date_from: 2026-10-01, date_to: 2026-10-31}]
    decoys:
      - {name: september, failure: wrong_date_range, source: ledger, kind: [spending], date_from: 2026-09-01, date_to: 2026-09-30}
      - name: with_card_bill
        failure: double_counting
        source: ledger
        kind: [spending]
        date_from: 2026-10-01
        date_to: 2026-10-31
        plus: [{source: bookings, measure: out, type: [card_settlement], date_from: 2026-10-01, date_to: 2026-10-31}]
      - name: with_own_transfers
        failure: double_counting
        source: ledger
        kind: [spending]
        date_from: 2026-10-01
        date_to: 2026-10-31
        plus: [{source: ledger, kind: [own_transfer], account: [ACC-PRIV], date_from: 2026-10-01, date_to: 2026-10-31}]
    traps:
      - Card purchases replace the card bill; counting both double counts CHF 4'375.10.
      - Savings standing orders, pillar 3a and the ETF plan are own transfers, not spending.

  - id: l07
    customer: lukas
    category: own_transfer
    split: held_out
    question: How much did I move into my savings accounts, my pillar 3a and my depot in October?
    call_sets:
      - [{tool: search_movements, arguments: {kind: '.*own_transfer.*', date_from: 2026-10-01, date_to: 2026-10-31}}]
      - [{tool: sum_by_counterparty, arguments: {kind: '.*own_transfer.*', date_from: 2026-10-01, date_to: 2026-10-31}}]
      - [{tool: sum_by_group, arguments: {kind: '.*own_transfer.*', date_from: 2026-10-01, date_to: 2026-10-31}}]
    example: [{tool: search_movements, arguments: {kind: [own_transfer], account_id: ACC-PRIV, date_from: 2026-10-01, date_to: 2026-10-31}}]
    figures:
      - {name: moved, source: bookings, measure: out, account: [ACC-PRIV], text: [Sparkonto, Vorsorgekonto, Depot], date_from: 2026-10-01, date_to: 2026-10-31}
      - {name: depot, source: bookings, measure: out, type: [securities_buy], date_from: 2026-10-01, date_to: 2026-10-31, required: false}
    traps:
      - Without kind own_transfer the ledger tools leave these movements out and report nothing.
      - The same money arrives on the savings accounts; adding both sides doubles it.

  - id: l08
    customer: lukas
    template: pillar_3a_this_year
    category: own_transfer
    split: tune
    question: How much have I paid into my pillar 3a this year?
    call_sets:
      - [{tool: tax_year_summary, arguments: {year: '2026'}}]
      - [{tool: search_movements, arguments: {kind: '.*own_transfer.*', date_from: 2026-01-01}}]
      - [{tool: sum_by_month, arguments: {kind: '.*own_transfer.*', date_from: 2026-01-01}}]
    example: [{tool: tax_year_summary, arguments: {year: 2026}}]
    figures:
      - {name: paid, source: bookings, measure: in, account: [ACC-3A], type: [standing_order], date_from: 2026-01-01, date_to: 2026-11-27}
    decoys:
      - {name: last_year, failure: wrong_date_range, source: bookings, measure: in, account: [ACC-3A], type: [standing_order], date_from: 2025-01-01, date_to: 2025-12-31}
    traps:
      - 3a payments are own transfers; the default kinds of the ledger tools leave them out.
      - The planned top-up to the yearly maximum is upcoming, not paid.

  - id: l09
    customer: lukas
    category: own_transfer
    split: tune
    question: Wie viel habe ich dieses Jahr in Wertschriften investiert?
    call_sets:
      - [{tool: search_movements, arguments: {kind: '.*own_transfer.*', date_from: 2026-01-01}}]
      - [{tool: sum_by_month, arguments: {kind: '.*own_transfer.*', date_from: 2026-01-01}}]
      - [{tool: list_portfolio_transactions, arguments: {date_from: 2026-01-01}}]
    example: [{tool: search_movements, arguments: {kind: [own_transfer], text: [Depot], date_from: 2026-01-01, date_to: 2026-11-27}}]
    figures:
      - {name: invested, source: bookings, measure: out, type: [securities_buy], date_from: 2026-01-01, date_to: 2026-11-27}
    traps:
      - Securities buys are own transfers into the depot, not spending, and need kind own_transfer.
      - The depot's value is not what was invested.

  - id: l10
    customer: lukas
    category: fx
    split: tune
    question: What did the deposit to Masseria Ulivo cost me in Swiss francs?
    call_sets:
      - [{tool: search_movements, arguments: {text: '.*masseria.*'}}]
    example: [{tool: search_movements, arguments: {text: [Masseria]}}]
    figures:
      - {name: deposit, source: bookings, measure: out, text: [Masseria]}
    decoys:
      - {name: in_euro, failure: wrong_currency, source: bookings, measure: original, text: [Masseria]}
    traps:
      - The booking was EUR 400; the CHF amount is what left the account.

  - id: l11
    customer: lukas
    category: fx
    split: held_out
    question: How much did my Etsy order on 1 November cost me in CHF, fees included?
    call_sets:
      - [{tool: search_movements, arguments: {text: '.*etsy.*'}}]
    example: [{tool: search_movements, arguments: {text: [Etsy], date_from: 2026-11-01, date_to: 2026-11-01}}]
    figures:
      - {name: paid, source: ledger, text: [Etsy], date_from: 2026-11-01, date_to: 2026-11-01}
    decoys:
      - {name: in_dollars, failure: wrong_currency, source: card, measure: original, text: [Etsy], date_from: 2026-11-01, date_to: 2026-11-01}
      - name: without_fee
        failure: wrong_currency
        source: card
        measure: out
        text: [Etsy]
        date_from: 2026-11-01
        date_to: 2026-11-01
        minus: [{source: card, measure: fee, text: [Etsy], date_from: 2026-11-01, date_to: 2026-11-01}]
    traps:
      - The card's amount_chf already holds the 1.75 % fee; the fee itself is in no tool result.
      - USD 65.40 is the original amount, not what was charged.

  - id: l12
    customer: lukas
    category: fx
    split: tune
    question: How much did I pay in foreign currency fees on my Visa card in July?
    call_sets:
      - []
    example: [{tool: search_movements, arguments: {card_id: CARD-VISA, date_from: 2026-07-01, date_to: 2026-07-31}}]
    figures: []
    decoys:
      - {name: fees, failure: invented_figure, source: card, measure: fee, date_from: 2026-07-01, date_to: 2026-07-31}
    traps:
      - No tool returns the fx fee; the answer has to say it cannot see the fee separately.
      - Working out 1.75 % of the purchases in the answer is a figure no tool computed.

  - id: l13
    customer: lukas
    category: refund
    split: tune
    question: How much has my health insurer refunded me this year?
    call_sets:
      - [{tool: search_movements, arguments: {text: '.*mythen.*', date_from: 2026-01-01}}]
      - [{tool: sum_by_counterparty, arguments: {date_from: 2026-01-01}}]
    example: [{tool: search_movements, arguments: {text: [Mythen], kind: [credit], date_from: 2026-01-01, date_to: 2026-11-27}}]
    figures:
      - {name: refunded, source: bookings, measure: in, text: [Mythen], date_from: 2026-01-01, date_to: 2026-11-27}
    decoys:
      - {name: premiums, failure: wrong_sign, source: bookings, measure: out, text: [Mythen], date_from: 2026-01-01, date_to: 2026-11-27}
    traps:
      - The insurer is also the payee of the premiums; refunds are money in.

  - id: l14
    customer: lukas
    category: refund
    split: tune
    question: Did I get money back from Digitec in October, and how much?
    call_sets:
      - [{tool: search_movements, arguments: {text: '.*digitec.*'}}]
    example: [{tool: search_movements, arguments: {text: [Digitec], date_from: 2026-10-01, date_to: 2026-10-31}}]
    figures:
      - {name: refund, source: ledger, card: CARD-VISA, measure: in, text: [Digitec], date_from: 2026-10-01, date_to: 2026-10-31}
    traps:
      - A card refund is a negative amount_chf on the card, money in for the ledger.

  - id: l15
    customer: lukas
    category: refund
    split: tune
    question: Wie viel Spesen hat mir mein Arbeitgeber dieses Jahr zurückerstattet?
    call_sets:
      - [{tool: search_movements, arguments: {text: '.*limmatblau.*', date_from: 2026-01-01}}]
