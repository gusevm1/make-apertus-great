    example: [{tool: search_movements, arguments: {text: [Limmatblau], kind: [credit], amount_max: 1000, date_from: 2026-01-01, date_to: 2026-11-27}}]
    figures:
      - {name: expenses, source: bookings, measure: in, text: [Limmatblau], type: [incoming_transfer], date_from: 2026-01-01, date_to: 2026-11-27}
    decoys:
      - {name: with_salary, failure: in_source_but_wrong, source: bookings, measure: in, text: [Limmatblau], date_from: 2026-01-01, date_to: 2026-11-27}
    traps:
      - The salary comes from the same employer; only the incoming transfers are expenses.

  - id: l16
    customer: lukas
    category: period_spending
    split: held_out
    question: What did I pay for Netflix this year?
    call_sets:
      - [{tool: search_movements, arguments: {text: '.*netflix.*', date_from: 2026-01-01}}]
      - [{tool: sum_by_month, arguments: {text: '.*netflix.*', date_from: 2026-01-01}}]
    example: [{tool: search_movements, arguments: {text: [Netflix], date_from: 2026-01-01, date_to: 2026-11-27}}]
    figures:
      - {name: paid, source: ledger, text: [Netflix], date_from: 2026-01-01, date_to: 2026-11-27}
    traps:
      - Netflix is on the Visa card, so it shows only among card purchases.

  - id: l17
    customer: lukas
    category: multi_call
    split: tune
    question: How much did I spend at Migros, Coop and Denner together last month?
    call_sets:
      - [{tool: search_movements, arguments: {text: '(?=.*migros)(?=.*coop)(?=.*denner).*', date_from: 2026-10-01, date_to: 2026-10-31}}]
      - [{tool: sum_by_month, arguments: {text: '(?=.*migros)(?=.*coop)(?=.*denner).*', date_to: 2026-10-31}}]
      - [{tool: sum_by_counterparty, arguments: {text: '(?=.*migros)(?=.*coop)(?=.*denner).*', date_from: 2026-10-01, date_to: 2026-10-31}}]
      - - {tool: search_movements, arguments: {text: '.*migros.*', date_from: 2026-10-01, date_to: 2026-10-31}}
        - {tool: search_movements, arguments: {text: '.*coop.*', date_from: 2026-10-01, date_to: 2026-10-31}}
        - {tool: search_movements, arguments: {text: '.*denner.*', date_from: 2026-10-01, date_to: 2026-10-31}}
    example: [{tool: search_movements, arguments: {text: [Migros, Coop, Denner], date_from: 2026-10-01, date_to: 2026-10-31}}]
    figures:
      - {name: together, source: ledger, text: [Migros, Coop, Denner], date_from: 2026-10-01, date_to: 2026-10-31}
      - {name: migros, source: ledger, text: [Migros], date_from: 2026-10-01, date_to: 2026-10-31, required: false}
      - {name: coop, source: ledger, text: [Coop], date_from: 2026-10-01, date_to: 2026-10-31, required: false}
      - {name: denner, source: ledger, text: [Denner], date_from: 2026-10-01, date_to: 2026-10-31, required: false}
    traps:
      - One call with all three names gives the total; three calls make the answer add them up.
      - Coop Pronto is a Coop shop and counts.

  - id: l18
    customer: lukas
    template: shop_last_6_months
    category: relative_date
    split: tune
    question: How much did I spend at Coop in the last 6 months?
    call_sets:
      - [{tool: search_movements, arguments: {text: '.*coop.*', date_from: '2026-0[56]-.*'}}]
      - [{tool: sum_by_month, arguments: {text: '.*coop.*', date_from: '2026-0[56]-.*'}}]
    example: [{tool: sum_by_month, arguments: {text: [Coop], date_from: 2026-05-01, date_to: 2026-10-31}}]
    figures:
      - {name: may_to_october, group: six_months, source: ledger, text: [Coop], date_from: 2026-05-01, date_to: 2026-10-31}
      - {name: june_to_today, group: six_months, source: ledger, text: [Coop], date_from: 2026-06-01, date_to: 2026-11-27}
      - {name: rolling, group: six_months, source: ledger, text: [Coop], date_from: 2026-05-27, date_to: 2026-11-27}
    traps:
      - The today block names no "last 6 months"; the answer has to say which months it counted.

  - id: l19
    customer: lukas
    category: multi_call
    split: held_out
    question: Wie viel hat mir Sara dieses Jahr überwiesen, und wie viel Miete habe ich bezahlt?
    call_sets:
      - - {tool: search_movements, arguments: {text: '.*sara.*', date_from: 2026-01-01}}
        - {tool: search_movements, arguments: {text: '.*(wohnbau|sihlfeld|miete).*', date_from: 2026-01-01}}
      - [{tool: sum_by_counterparty, arguments: {date_from: 2026-01-01}}]
    example:
      - {tool: search_movements, arguments: {text: [Sara Keller], date_from: 2026-01-01, date_to: 2026-11-27}}
      - {tool: search_movements, arguments: {text: [Wohnbau Sihlfeld], date_from: 2026-01-01, date_to: 2026-11-27}}
    figures:
      - {name: from_sara, source: bookings, measure: in, text: [Sara Keller], date_from: 2026-01-01, date_to: 2026-11-27}
      - {name: rent, source: bookings, measure: out, text: [Wohnbau Sihlfeld], date_from: 2026-01-01, date_to: 2026-11-27}
    traps:
      - Sara pays by bank transfer and by TWINT; both count.
      - Rent is booked at the end of the month before the one it pays for.
      - The difference of the two is arithmetic no tool did.

  - id: l20
    customer: lukas
    category: relative_date
    split: held_out
    question: Compare my spending in October 2026 with October 2025.
    call_sets:
      - [{tool: compare_periods, arguments: {first_from: '2026-10-01|2025-10-01', second_from: '2026-10-01|2025-10-01'}}]
      - [{tool: sum_by_group, arguments: {group_by: year}}]
      - - {tool: sum_by_month, arguments: {date_to: 2026-10-31}}
    example: [{tool: compare_periods, arguments: {first_from: 2025-10-01, first_to: 2025-10-31, second_from: 2026-10-01, second_to: 2026-10-31, kind: [spending]}}]
    figures:
      - {name: october_2026, source: ledger, kind: [spending], date_from: 2026-10-01, date_to: 2026-10-31}
      - {name: october_2025, source: ledger, kind: [spending], date_from: 2025-10-01, date_to: 2025-10-31}
      - name: change
        required: false
        source: ledger
        kind: [spending]
        date_from: 2026-10-01
        date_to: 2026-10-31
        minus: [{source: ledger, kind: [spending], date_from: 2025-10-01, date_to: 2025-10-31}]
    decoys:
      - name: with_card_bill_2026
        failure: double_counting
        source: ledger
        kind: [spending]
        date_from: 2026-10-01
        date_to: 2026-10-31
        plus: [{source: bookings, measure: out, type: [card_settlement], date_from: 2026-10-01, date_to: 2026-10-31}]
    traps:
      - The change comes from compare_periods, never from subtracting in the answer.

  - id: l21
    customer: lukas
    category: balance
    split: tune
    question: Wie viel ist auf meinem Rücklagenkonto?
    call_sets:
      - [{tool: list_accounts}]
    example: [{tool: list_accounts}]
