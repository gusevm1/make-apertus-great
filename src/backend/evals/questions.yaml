# One entry per question. `calls` lists the calls it needs; none at all means no tool may be called.
# An argument is a regular expression the value must match in full, ignoring case.
# A left-out argument counts as "", so a trailing `?` accepts the tool's default.
# `any_calls: true` leaves the calls unchecked, except for `not_called`.
# `not_called` names tools that must not be called.
# `answer` is a regular expression the answer must contain, ignoring case.
# `answer_not` is a regular expression the answer must not contain, ignoring case.
# `rule` groups questions in the summary, which prints passed and total per rule.
# `before` lists earlier messages of the same conversation; only the calls for the last one count.
# `quote` is a passage of the reply to the last `before` message, quoted in the question.
#
# Example:
# - question: How much money do I have?
#   calls:
#     - tool: list_accounts
#   not_called: [search_web]

- question: How much did I spend at online shops last month?
  calls:
    - tool: search_movements
      arguments:
        date_from: "2026-10-01"
        date_to: "2026-10-31"
  not_called: [list_bookings, list_card_transactions]
- question: Did I pay my rent in each of the last 3 months?
  calls:
    - tool: sum_by_month
      arguments:
        date_from: "2026-(08|09)-01"
        date_to: '2026-(10-31|11-\d\d)'
- question: Can you show me my monthly spending over the last 6 months?
  calls:
    - tool: sum_by_month
      arguments:
        date_from: "2026-(05|06)-01"
