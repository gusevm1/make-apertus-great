# One entry per question. `calls` lists the calls it needs; none at all means no tool may be called.
# An argument is a regular expression the value must match in full, ignoring case.
# A left-out argument counts as "", so a trailing `?` accepts the tool's default.
# `any_calls: true` leaves the calls unchecked, except for `not_called`.
# `not_called` names tools that must not be called.
# `answer` is a regular expression the answer must contain, ignoring case.
# `answer_not` is a regular expression the answer must not contain, ignoring case.
# `rule` groups questions in the summary, which prints passed and total per rule.
# `before` lists earlier messages of the same conversation; only the calls for the last one count.
# `quote` is a passage of the reply to the last `before` message, quoted in the question.
#
# Example:
# - question: How much money do I have?
#   calls:
#     - tool: list_accounts
#   not_called: [search_web]

- question: How much did I spend at online shops last month?
  calls:
    - tool: search_movements
      arguments:
        date_from: "2026-10-01"
        date_to: "2026-10-31"
  not_called: [list_bookings, list_card_transactions]
- question: Did I pay my rent in each of the last 3 months?
  calls:
    - tool: sum_by_month
      arguments:
        date_from: "2026-(08|09)-01"
        date_to: '2026-(10-31|11-\d\d)'
- question: Can you show me my monthly spending over the last 6 months?
  calls:
    - tool: sum_by_month
      arguments:
        date_from: "2026-(05|06)-01"
- question: How has my spending changed since I started working?
  customer: jana
  # The server finds her salary start, September 2025; dates of the model's own are a guess.
  calls:
    - tool: compare_periods
      arguments:
        since_salary_start: "true"
- question: Is my spending going up or down over the last year?
  calls:
    - tool: forecast_months
      arguments:
        months_back: "(12)?"
        kind: ".*spending.*"
- question: What will I spend per month in the next 3 months if this continues?
  calls:
    - tool: forecast_months
      arguments:
        months_ahead: "3"
- question: How much did we spend in 2025 compared with 2024?
  calls:
    - tool: sum_by_group
      arguments:
        group_by: "year"
- question: Do I spend more at weekends?
  calls:
    - tool: sum_by_group
      arguments:
        group_by: "weekday"
- question: Is anything unusual on my accounts since September?
  calls:
    - tool: find_unusual_movements
      arguments:
        date_from: "2026-09-01"
  answer: "Digitec"
- question: How much came in and went out last month?
  calls:
    - tool: sum_by_group
      arguments:
        group_by: "kind"
        date_from: "2026-10-01"
- question: What were my five largest payments this year?
  calls:
    - tool: search_movements
      arguments:
        sort: "largest"
        limit: "5"
- question: What is my savings goal?
  calls:
    - tool: get_customer
  answer: Japan
- question: Why is my private account lower than a month ago?
  calls:
    - tool: explain_balance_change
      arguments:
        account_id: ACC-PRIV
        date_from: '2026-10-2\d'
        date_to: '2026-11-2\d'
  not_called: [search_web]
- question: What do I need for my 2025 tax return?
  calls:
    - tool: tax_year_summary
      arguments:
        year: "2025"
  answer: (tax advice|Steuerberatung)
  not_called: [search_web]
- question: Show my monthly spending over the last 6 months as a chart
  calls:
    - tool: sum_by_month
    - tool: build_widget
  rule: widgets
- question: Create a widget listing the payments due in the next 30 days
  calls:
    - tool: list_upcoming_payments
    - tool: build_widget
  rule: widgets
- question: Zeig mir meine Ausgaben der letzten 6 Monate als Grafik
  calls:
    - tool: sum_by_month
    - tool: build_widget
  rule: widgets
- question: Show me my bookings from last week
  any_calls: true
  not_called: [build_widget]
  rule: widgets
- question: Was kannst du für mich tun?
  answer: Zahlung
  answer_not: keinen Zugriff|kein Zugriff|Prüfen Sie|Schauen Sie|Sehen Sie
- question: Tell me about my mortgage
  customer: marco
  rule: tools-only
  # The profile names the mortgage tranche, but the answer has to come from a read.
  calls:
    - tool: list_loans
- question: What has the Japan trip cost me so far?
  calls:
    - tool: sum_spending
      arguments:
        group_by: personal_tag
        personal_tag: ".*japan.*"
  not_called: [search_web]
- question: How much of my restaurant budget is left this month?
  calls:
    - tool: compare_budgets
      arguments:
        month: "(2026-11)?"
  not_called: [search_web, sum_spending]
