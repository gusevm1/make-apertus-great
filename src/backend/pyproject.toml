[project]
name = "trustroom-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "openai>=3.51.0",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "ANN", "N", "T20", "SIM"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Template imports (op, sa) must survive the post-write hook in empty migrations.
"migrations/versions/*" = ["F401"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["app", "evals", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
