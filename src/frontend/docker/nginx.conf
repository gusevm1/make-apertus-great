server {
    listen 80;
    root /usr/share/nginx/html;

    # Same origin for the page and the API, so the backend's origin check passes.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 11m;
    }

    # Bundles carry their hash in the name; a missing one is a 404, never the page as a script.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page names the current bundles, so the browser asks for it again after every deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
